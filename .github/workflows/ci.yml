name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs elan, fetches the Mathlib cache, runs `lake build`.
      - uses: leanprover/lean-action@v1
      - name: Check axioms
        run: STRICT=1 scripts/check_axioms.sh
